<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Secreta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tag {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 10px;
            color: #fff;
        }
        h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: #d1d1d1;
            margin-bottom: 30px;
            font-style: italic;
        }
        .message-box {
            background-color: #1a1a1a;
            border-left: 3px solid #d4af37;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #b0b0b0;
            text-align: left;
        }
        .btn-download {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">??? • MISIÓN SECRETA • ???</div>
        <h1>Nata...</h1>
        <h2>¿De verdad quieres saber?</h2>

        <div class="message-box">
            <p>Sé que tienes curiosidad por descubrir qué hay aquí guardado.</p>
            <br>
            <p><strong>Recuerda:</strong> Tu amigo secreto sabe que eres bastante curiosa. 😏</p>
        </div>

        <a href="https://drive.google.com/uc?export=download&id=1DRHGi_U5JohCXJcjMIJ1v4muLk9C5OPn" class="btn-download">
            Revelar el secreto
        </a>

        <p class="footer-note">La pregunta no es qué hay dentro... sino cuándo puedes abrirlo. ¿?</p>
    </div>

</body>
</html>
